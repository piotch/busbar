[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "busbar"
version = "0.1.0"
description = "An open catalogue of UK electricity grid datasets and source observation tools"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["rdflib>=7.1,<8", "pyshacl>=0.30,<1"]

[project.optional-dependencies]
s3 = ["boto3>=1.36,<2", "python-dotenv>=1,<2"]

[project.urls]
Repository = "https://github.com/piotch/busbar"

[project.scripts]
busbar = "busbar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/busbar"]

[tool.hatch.build.targets.wheel.force-include]
"catalogue.ttl" = "busbar/data/catalogue.ttl"
"busbar-ontology.ttl" = "busbar/data/busbar-ontology.ttl"
"definitions" = "busbar/data/definitions"
"vocabulary" = "busbar/data/vocabulary"
"shapes" = "busbar/data/shapes"
"queries" = "busbar/data/queries"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/definitions", "/vocabulary", "/shapes", "/queries", "/*.ttl", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]
